<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>מחסן</title>
  <meta name="description" content="ניהול מלאי למחסן מסעדה בסריקה מהטלפון">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מחסן">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">מלאי</h1>
    <div id="topActions"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="inventory" class="active"><span class="ic">📦</span><span>מלאי</span></button>
    <button data-tab="scan"><span class="ic">📷</span><span>סריקה</span></button>
    <button data-tab="count"><span class="ic">🔢</span><span>ספירה</span></button>
    <button data-tab="low"><span class="ic">⚠️</span><span>חסרים</span><b class="badge" id="lowBadge" hidden></b></button>
    <button data-tab="settings"><span class="ic">⚙️</span><span>הגדרות</span></button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <div class="toast" id="toast" hidden></div>

  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="vendor/xlsx.full.min.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
